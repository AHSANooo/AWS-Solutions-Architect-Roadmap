name: Lint & Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint Markdown Files
        run: |
          markdownlint . || true

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check YAML Syntax
        run: |
          if command -v yamllint &> /dev/null; then
            yamllint .github/workflows/ || true
          else
            echo "yamllint not installed, skipping YAML validation"
          fi
      
      - name: Validate JSON Files
        run: |
          find . -name "*.json" -type f ! -path "./.git/*" | while read file; do
            echo "Validating $file"
            python3 -m json.tool "$file" > /dev/null || echo "Invalid JSON: $file"
          done || true

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        continue-on-error: true
      
      - name: Terraform Format Check
        working-directory: ./iac/terraform
        run: |
          if [ -f "*.tf" ]; then
            terraform fmt -check -recursive . || echo "Terraform format check skipped or failed"
          fi
        continue-on-error: true
      
      - name: Terraform Init & Validate
        working-directory: ./iac/terraform
        run: |
          if [ -f "*.tf" ]; then
            terraform init -backend=false
            terraform validate
          fi
        continue-on-error: true

  cloudformation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate CloudFormation Templates
        run: |
          if ! command -v cfn-lint &> /dev/null; then
            echo "cfn-lint not installed, skipping CloudFormation validation"
          else
            find ./iac/cloudformation -name "*.json" -o -name "*.yaml" -o -name "*.yml" | while read file; do
              if [ -f "$file" ]; then
                echo "Validating $file"
                cfn-lint "$file" || true
              fi
            done
          fi
        continue-on-error: true
