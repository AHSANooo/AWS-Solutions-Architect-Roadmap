version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack_main
    ports:
      - "4566:4566"                  # LocalStack Gateway
      - "4571:4571"                  # AWS Lambda
    environment:
      - DEBUG=1
      - SERVICES=ec2,s3,dynamodb,rds,iam,sns,sqs,cloudwatch,logs,kms,route53
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ACCOUNT_ID=000000000000
    volumes:
      - "${TMPDIR:-/tmp/localstack}:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./scripts:/docker-entrypoint-initaws.d"
    networks:
      - localstack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: LocalStack UI (Pro feature, but useful for debugging)
  localstack-ui:
    image: localstack/localstack-ui:latest
    container_name: localstack_ui
    ports:
      - "8080:8080"
    environment:
      - LOCALSTACK_API_ENDPOINT=http://localstack:4566
    depends_on:
      - localstack
    networks:
      - localstack-network

networks:
  localstack-network:
    driver: bridge
